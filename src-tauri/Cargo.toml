[package]
name = "lunes-trabalho"
version = "0.1.0"
edition = "2021"
authors = ["Luiz Gustavo Nunes"]
license-file = "../LICENSE.md"
description = "Tarefas, reuniões e entregas locais"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "=2.5.2"
